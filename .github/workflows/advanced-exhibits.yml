name: Advanced Exhibit Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advanced-exhibits-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout literal head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install hash-locked Tower environment
        run: |
          python -m pip install --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Validate canonical authority
        run: tower validate

      - name: Reject generated and Atlas drift
        run: |
          set -euo pipefail
          tower generate --check
          python tools/audit_advanced_exhibits.py --check

      - name: Validate pinned nervous-system contract
        run: python scripts/validate_nervous_system.py --verify-remote --freshness

      - name: Run repository tests
        run: pytest -q

      - name: Execute all governed exhibit gates
        run: tower build --all --allow-blocked --output /tmp/advanced-exhibit-build-report.json

      - name: Verify immutable integrity
        run: tower integrity verify

  required-advanced-exhibit-gate:
    name: required-advanced-exhibit-gate
    if: always()
    needs: [verify]
    runs-on: ubuntu-24.04
    steps:
      - name: Require Advanced Exhibit verification
        run: test "${{ needs.verify.result }}" = "success"
