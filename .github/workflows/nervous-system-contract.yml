name: Nervous System Contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nervous-system-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout literal head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install hash-locked Tower environment
        run: |
          python -m pip install --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Materialize and reject generated-surface drift
        run: |
          set -euo pipefail
          tower generate
          git diff --exit-code -- README.md generated/ src/babel_registry.py mastermind_sidecar.py src/tower/data

      - name: Validate pinned nervous-system contract
        run: python scripts/validate_nervous_system.py --verify-remote --freshness

  required-nervous-system-contract:
    name: required-nervous-system-contract
    if: always()
    needs: [validate]
    runs-on: ubuntu-24.04
    steps:
      - name: Require nervous-system validation
        run: test "${{ needs.validate.result }}" = "success"
