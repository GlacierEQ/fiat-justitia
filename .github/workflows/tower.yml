name: Tower Verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tower-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install hash-locked Tower environment
        run: |
          python -m pip install --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Generate branch-head integrity candidate
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from pathlib import Path
          from tower.integrity import write_manifest
          write_manifest(Path("artifacts/file_hashes.json"))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tower-integrity-candidate
          path: artifacts/file_hashes.json
          if-no-files-found: error
          retention-days: 3

  governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Install hash-locked Tower environment
        run: |
          python -m pip install --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Install declared portable benchmark tools
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler wabt
      - name: Validate canonical registry
        run: tower validate
      - name: Reject generated-surface drift
        run: tower generate --check
      - name: Run Python governance tests
        run: pytest -q
      - name: Verify immutable integrity ledger
        run: tower integrity verify
      - name: Build governed floors with explicit blockers
        run: tower build --all --allow-blocked --output artifacts/build-report.json
      - name: Benchmark portable floors
        run: tower benchmark python c cpp rust go typescript webassembly --output artifacts/benchmarks.json
      - name: Bind proof state to build and benchmark evidence
        run: >-
          tower proof-report
          --build-report artifacts/build-report.json
          --benchmark-report artifacts/benchmarks.json
          --allow-blocked
          --output artifacts/proof-report.json
      - name: Emit deterministic release receipt
        run: tower receipt --build-report artifacts/build-report.json --output artifacts/tower_receipt.json
      - name: Attest Tower evidence with OIDC-bound Sigstore provenance
        id: attest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            artifacts/build-report.json
            artifacts/tower_receipt.json
            artifacts/benchmarks.json
            artifacts/proof-report.json
      - name: Upload Tower governance receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tower-governance-receipts
          path: |
            artifacts/build-report.json
            artifacts/tower_receipt.json
            artifacts/benchmarks.json
            artifacts/proof-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload Sigstore attestation bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tower-governance-attestation
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30

  flagship-portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/flagship-rust-target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.83.0"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23.4"
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - run: npm install --global typescript@5.7.2
      - run: sudo apt-get update && sudo apt-get install -y sqlite3 wabt protobuf-compiler
      - name: Install hash-locked Tower environment
        run: |
          python -m pip install --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Execute strict polyglot mission pipeline
        run: python flagship/run_pipeline.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tower-polyglot-flagship
          path: build/flagship
          if-no-files-found: error
          retention-days: 14

  portable-floor-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        floor: [python, c, cpp, rust, go, typescript, protobuf, webassembly]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.83.0"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23.4"
      - run: npm install --global typescript@5.7.2
      - run: sudo apt-get update && sudo apt-get install -y gcc g++ protobuf-compiler wabt
      - name: Install hash-locked Tower environment
        run: |
          python -m pip install --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - run: tower build "${{ matrix.floor }}" --output "artifacts/${{ matrix.floor }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: floor-${{ matrix.floor }}
          path: artifacts/${{ matrix.floor }}.json
          if-no-files-found: error
          retention-days: 14

  required-tower-verification:
    name: required-tower-verification
    if: always()
    needs: [integrity-candidate, governance, flagship-portable, portable-floor-compile]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Tower verification job
        run: |
          test "${{ needs.integrity-candidate.result }}" = "success"
          test "${{ needs.governance.result }}" = "success"
          test "${{ needs.flagship-portable.result }}" = "success"
          test "${{ needs.portable-floor-compile.result }}" = "success"
