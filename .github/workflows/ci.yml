name: Tower of Babel Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tower-of-babel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout literal head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install hash-locked Tower environment
        run: |
          python -m pip install --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Compile Python sources
        run: python -m compileall -q src tests integrations mastermind_sidecar.py languages/python languages/protobuf scripts tools

      - name: Validate canonical registry and generated surfaces
        run: |
          tower validate
          tower generate --check
          python tools/audit_advanced_exhibits.py --check

      - name: Run governed repository tests
        run: pytest -q

      - name: Verify immutable integrity ledger
        run: tower integrity verify

  native-toolchains:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout literal head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.4"

      - uses: haskell-actions/setup@cd0d9bdd65b20557f41bea4dbe43d0b5fbbfe553 # v2
        with:
          ghc-version: "9.8.2"
          enable-stack: false
          cabal-update: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.83.0"

      - name: Compile and run C exhibits
        run: |
          set -euo pipefail
          cc -std=c17 -O2 -Wall -Wextra -Werror languages/c/easy_linked_list.c -o /tmp/babel-c-easy
          cc -std=c17 -O2 -Wall -Wextra -Werror -pthread languages/c/advanced_lockfree_spsc_ring.c -o /tmp/babel-c-advanced
          /tmp/babel-c-easy
          /tmp/babel-c-advanced

      - name: Compile and run C++ exhibits
        run: |
          set -euo pipefail
          c++ -std=c++20 -O2 -Wall -Wextra -Werror languages/cpp/easy_vector.cpp -o /tmp/babel-cpp-easy
          c++ -std=c++20 -O2 -Wall -Wextra -Werror languages/cpp/advanced_kv_entropy.cpp -o /tmp/babel-cpp-advanced
          /tmp/babel-cpp-easy
          /tmp/babel-cpp-advanced

      - name: Format and test Go exhibits
        run: |
          set -euo pipefail
          test -z "$(gofmt -l languages/go)"
          go test ./languages/go -v

      - name: Compile and run Haskell exhibits
        run: |
          set -euo pipefail
          ghc -O2 -Wall -Werror -outputdir /tmp/babel-ghc-easy languages/haskell/easy_tree.hs -o /tmp/babel-haskell-easy
          ghc -O2 -Wall -Werror -outputdir /tmp/babel-ghc-advanced languages/haskell/advanced_ast_validator.hs -o /tmp/babel-haskell-advanced
          /tmp/babel-haskell-easy
          /tmp/babel-haskell-advanced

      - name: Compile and test Rust exhibits
        run: |
          set -euo pipefail
          rustc --edition=2021 -D warnings languages/rust/easy_counter.rs -o /tmp/babel-rust-easy
          rustc --edition=2021 -D warnings --test languages/rust/advanced_safety_governor.rs -o /tmp/babel-rust-tests
          /tmp/babel-rust-easy
          /tmp/babel-rust-tests

  required-quality-gate:
    name: required-quality-gate
    if: always()
    needs: [registry-contract, native-toolchains]
    runs-on: ubuntu-24.04
    steps:
      - name: Require registry and strict native validation
        run: |
          test "${{ needs.registry-contract.result }}" = "success"
          test "${{ needs.native-toolchains.result }}" = "success"
